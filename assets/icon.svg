<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="FreeListen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2d3a"/>
      <stop offset="1" stop-color="#15161c"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f08fc8"/>
      <stop offset="1" stop-color="#ba478f"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Music note: the beam doubles as the downward arrow's shaft. -->
  <g fill="none" stroke="url(#fg)" stroke-width="15"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 170V74l76-14v96"/>
    <circle cx="84" cy="170" r="21" fill="url(#fg)" stroke="none"/>
    <circle cx="160" cy="156" r="21" fill="url(#fg)" stroke="none"/>
  </g>

  <!-- Download arrow, marking this as the thing that fetches music. -->
  <g fill="none" stroke="#ffffff" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M52 196v12a12 12 0 0 0 12 12h40"/>
    <path d="M52 120v44"/>
    <path d="M36 150l16 16 16-16"/>
  </g>
</svg>
