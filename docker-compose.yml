services:
  freelisten:
    # Pulls the published image by default. `build: .` is kept alongside it so
    # `docker compose build` works locally without editing this file.
    image: ghcr.io/alextheguy1/freelisten:latest
    build: .
    container_name: freelisten
    ports:
      - "5051:5051"
    volumes:
      - ${MUSIC_DIR_HOST:-./music}:/music
      - ${CONFIG_DIR_HOST:-./config}:/config
    restart: unless-stopped
