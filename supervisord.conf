[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Both programs inherit the container's environment (MUSIC_DIR, settings,
; etc.) - each [program] section's `environment=` only adds/overrides the
; values it actually needs to differ on (namely PORT, since the two
; processes can't both listen on 5051).

[program:playlist-backend]
command=/opt/venv/bin/python app.py
directory=/app/playlist-backend
environment=PORT="5058"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:music-search]
command=node server.js
directory=/app/backend
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
